      - {address: 3033, name: "{i} Phase Voltage", repeat: [A, B, C], scale: 0.1, unit: V}
      - {address: 3036, name: "{i} Phase Current", repeat: [A, B, C], scale: 0.1, unit: A}
      - {address: 3040, name: Working Mode}
      - {address: 3041, name: Inverter Temperature, scale: 0.1, unit: C}
      - {address: 3042, name: Grid Frequency, scale: 0.01, unit: Hz}
      - {address: 3043, name: Inverter Status}
      - {address: 3044, name: Limited active power adjustment rated power output value, width: 2, scale: 1, unit: W}
