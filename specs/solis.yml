      - {address: 3251, name: "Meter AC Current {i}", repeat: [A, B, C], stride: 2, scale: 0.01, unit: A}
      - {address: 3256, name: "Meter AC Active Power {i}", repeat: [A, B, C], stride: 2, width: 2, scale: 0.001, unit: kW}
      - {address: 3262, name: Meter AC Active Power Total, width: 2, scale: 0.001, unit: kW}
      - {address: 3280, name: Meter Power Factor, scale: 0.01}
      - {address: 3281, name: Meter Grid Frequency, scale: 0.01, unit: Hz}
      - {address: 3282, name: Meter Grid Import Total Energy, width: 2, scale: 1, unit: kWh}
      - {address: 3284, name: Meter Grid Export Total Energy, width: 2, scale: 1, unit: kWh}
      - {address: 36013, name: EPM Model No}
      - {address: 36014, name: Inverter EPM Firmware Version}
